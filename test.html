<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reagan Secrest - Resume</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="icon" type="image/jpeg" href="favicon.jpg">

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
}

/* full screen center */
#container {
    height: 100vh;
    width: 100vw;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* canvas = single page view */
canvas {
    max-width: 100vw;
    max-height: 100vh;

    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    background: white;
}
</style>
</head>

<body>

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const url = "https://solitary-bar-13d6.luisandreagan.workers.dev/pdf";
const container = document.getElementById("container");

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function render() {
    const pdf = await pdfjsLib.getDocument(url).promise;

    // ONLY first page (resume = single clean view)
    const page = await pdf.getPage(1);

    const viewport = page.getViewport({ scale: 1 });

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;

    // 🔥 KEY: always fit inside screen (no scroll needed)
    const scale = Math.min(
        screenW / viewport.width,
        screenH / viewport.height
    );

    const scaledViewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;

    container.appendChild(canvas);

    await page.render({
        canvasContext: ctx,
        viewport: scaledViewport
    }).promise;
}

render();

/* fix rotation */
window.addEventListener("resize", () => {
    container.innerHTML = "";
    render();
});
</script>

</body>
</html>
