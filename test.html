<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reagan Secrest - Resume</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="icon" type="image/jpeg" href="favicon.jpg">

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
}

#viewer {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 90px;
}

canvas {
    max-width: 100vw;
    max-height: 100vh;
    background: white;
}

/* Floating buttons */
.fab-container {
    position: fixed;
    bottom: 90px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.fab-container.hidden {
    display: none;
}

.fab {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    color: white;
    font-size: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.main-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: #1e90ff;
    color: white;
    font-size: 26px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

.call { background: #28a745; }
.email { background: #ff9800; }
.contact { background: #6c63ff; }

</style>
</head>

<body>

<div id="viewer"></div>

<div class="fab-container hidden" id="fabMenu">
    <button class="fab call" onclick="callNow()">📞</button>
    <button class="fab email" onclick="sendEmail()">✉️</button>
    <button class="fab contact" onclick="addContact()">👤</button>
</div>

<button class="main-fab" onclick="toggleMenu()">+</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const pdfURL = "https://solitary-bar-13d6.luisandreagan.workers.dev/pdf";
const viewer = document.getElementById("viewer");
const menu = document.getElementById("fabMenu");

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function renderPDF() {
    const pdf = await pdfjsLib.getDocument(pdfURL).promise;

    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1 });

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;

    // 🔥 FIT TO SCREEN
    const scale = Math.min(
        screenW / viewport.width,
        screenH / viewport.height
    );

    const scaledViewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    // 🔥 QUALITY FIX (RETINA / HIGH DPI)
    const ratio = window.devicePixelRatio || 1;

    canvas.width = scaledViewport.width * ratio;
    canvas.height = scaledViewport.height * ratio;

    canvas.style.width = scaledViewport.width + "px";
    canvas.style.height = scaledViewport.height + "px";

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    viewer.appendChild(canvas);

    await page.render({
        canvasContext: ctx,
        viewport: scaledViewport
    }).promise;
}

renderPDF();

/* menu toggle */
function toggleMenu() {
    menu.classList.toggle("hidden");
}

/* actions */
function callNow() {
    window.location.href = "tel:3210988372";
}

function sendEmail() {
    window.location.href = "mailto:reagansecrest@example.com";
}

function addContact() {
    const vcard = `
BEGIN:VCARD
VERSION:3.0
FN:Reagan Secrest
TEL:321-098-8372
EMAIL:reagansecrest@example.com
END:VCARD
`;

    const blob = new Blob([vcard], { type: "text/vcard" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "reagan-secrest.vcf";
    a.click();
}

/* rotate fix */
window.addEventListener("resize", () => {
    viewer.innerHTML = "";
    renderPDF();
});
</script>

</body>
</html>
