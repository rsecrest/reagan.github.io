<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Reagan Resume</title>

<link rel="icon" type="image/jpeg" href="favicon.jpg">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
}

/* smooth vertical slide container */
#viewer {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: y mandatory;
}

/* each page is a full screen slide */
.page {
  height: 100vh;
  width: 100vw;

  display: flex;
  align-items: center;
  justify-content: center;

  scroll-snap-align: start;
}

/* canvas fits cleanly */
canvas {
  max-width: 100vw;
  max-height: 100vh;
  background: white;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<div id="viewer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const url = "https://solitary-bar-13d6.luisandreagan.workers.dev/pdf";
const viewer = document.getElementById("viewer");

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function renderPDF() {
  const pdf = await pdfjsLib.getDocument(url).promise;

  const screenW = window.innerWidth;
  const screenH = window.innerHeight;

  // PRE-CREATE ALL PAGES FIRST (no loading feel)
  const pages = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    const pageDiv = document.createElement("div");
    pageDiv.className = "page";

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    pageDiv.appendChild(canvas);
    viewer.appendChild(pageDiv);

    pages.push({ pageNum: i, canvas, ctx });
  }

  // RENDER ALL PAGES (parallel feel using Promise.all)
  await Promise.all(
    pages.map(async (item) => {
      const page = await pdf.getPage(item.pageNum);
      const viewport = page.getViewport({ scale: 1 });

      const scale = Math.min(
        screenW / viewport.width,
        screenH / viewport.height
      );

      const scaledViewport = page.getViewport({ scale });

      item.canvas.width = scaledViewport.width;
      item.canvas.height = scaledViewport.height;

      await page.render({
        canvasContext: item.ctx,
        viewport: scaledViewport
      }).promise;
    })
  );
}

renderPDF();

/* keep perfect fit on rotate */
window.addEventListener("resize", () => {
  viewer.innerHTML = "";
  renderPDF();
});
</script>

</body>
</html>
